<main>
  <h1>manage</h1>
  <hr />
  <div>
    <button routerLink="/dashboard" class="profile-dashboardButton">
      <img src="icons/profile/back.svg" alt="dashboard" />
      dashboard
    </button>
    <button (click)="openPopup()" class="profile-logOutButton">
      <img src="icons/profile/logout.svg" alt="log out" />
      log out
    </button>
  </div>
</main>

@if (isPopupOpen) {
  <app-popup
    [text]="popupText"
    [button1]="'cancel'"
    [button2]="'delete'"
    [popupContext]="popupContext"
    (confirmed)="onConfirm()"
    (declined)="onDecline()"
    (closed)="onDecline()"
  ></app-popup>
}
