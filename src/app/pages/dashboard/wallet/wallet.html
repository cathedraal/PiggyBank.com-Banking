<main>
  <div class="dashboard-wallet" role="button" routerLink="/profile" tabindex="0">
    <div class="dashboard-walletHeader">
      <h4 class="dashboard-walletTitle">Main wallet balance</h4>
      <h4 class="dashboard-walletType" [style.backgroundColor]="userMainCard?.cardType?.color">
        {{ userMainCard?.cardType?.type }}
      </h4>
    </div>
    <h1 class="dashboard-walletBalance">
      <span>{{ userMainCard?.cardCurrency?.value }}</span
      >{{ userMainCard?.cardBalance | number: '1.2-2' }}
    </h1>
    <div class="dashboard-walletBottom">
      <img src="icons/wallet_safe.svg" alt="safe" class="dashboard-walletImg" />
      <p class="dashboard-walletCardNumber">{{ userCardNumber }}</p>
      @if (userService.getUser()!.cards!.length > 1) {
        <p class="dashboard-walletAmountOfCards">+{{ userService.getUser()!.cards!.length - 1 }}</p>
      }
      <button routerLink="/profile" class="dashboard-walletProfileButton">
        <img src="icons/wallet_profile.svg" alt="profile" />
      </button>
    </div>
  </div>
  <div class="dashboard-manageWalletDiv">
    <h4>Manage wallet</h4>
    <div class="dashboard-manageWalletButtons">
      <button class="dashboard-manageWalletAdd" (click)="onAddMoney()">
        <img src="icons/manageWallet_add.svg" alt="add" class="dashboard-manageWalletAddIcon" /> add
        money
      </button>
      <button class="dashboard-manageWalletTransfer" (click)="onTransferMoney()">
        <img
          src="icons/manageWallet_transfer.svg"
          alt="transfer"
          class="dashboard-manageWalletTransferIcon"
        />
        transfer <span>money</span>
      </button>
      <button class="dashboard-manageWalletWithdraw" (click)="onWithdrawMoney()">
        <img
          src="icons/manageWallet_withdraw.svg"
          alt=""
          class="dashboard-manageWalletWithdrawIcon"
        />
        withdraw <span>money</span>
      </button>
    </div>
  </div>
</main>
