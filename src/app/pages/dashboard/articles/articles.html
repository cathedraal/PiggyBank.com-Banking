<main>
    <button class="dashboard-articlesButton">
        <h4>Latest articles on PiggyBank</h4>
        <img src="icons/transactions_showAllButton.svg" alt="show all">
    </button>
    <div class="dashboard-articlesDiv">
            @for (article of articles; track $index) {
                <div class="dashboard-article">
                    <div class="dashboard-articleContent">
                        <div class="dashboard-articleImgDiv">
                            <img [src]="article.image" alt="article" class="dashboard-articleImg">
                            <img src="icons/white_logo.svg" alt="white logo" class="dashboard-articleLogo">
                            <p class="dashboard-articleTime"><img src="icons/time.svg" alt="time" class="dashboard-articleTimeIcon">{{article.time}}</p>
                        </div>
                        
                        <p class="dashboard-articleDate">{{article.date}}</p>
                        <h4>{{article.title}}</h4>
                    </div>
                    <button>{{article.btnText}}</button>
                </div>
            }
    </div>
</main>
