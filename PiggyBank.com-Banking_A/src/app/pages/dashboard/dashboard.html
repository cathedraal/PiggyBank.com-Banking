<div class="dashboard-header">
    <h1 class="dashboard-title">Hello, <span>{{ user?.name }}</span></h1>
    <h3 class="dashboard-subtitle">{{ subheader }}</h3>
</div>
<main>
    <app-currency></app-currency>
    @if (user!.cards.length === 0) {
        <app-empty-cards></app-empty-cards>
    } @else {
        <app-wallet></app-wallet>
    }
    <app-transaction-benefits></app-transaction-benefits>
    <app-transactions></app-transactions>
    <app-support></app-support>
    <app-benefits></app-benefits>
    <app-articles></app-articles>
    <button routerLink="/add-card">Back</button>
</main>
