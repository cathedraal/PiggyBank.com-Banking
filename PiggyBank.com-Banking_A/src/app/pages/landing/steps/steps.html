<main>
  <div class="landing-stepsTopDiv">
    <img src="icons/landing/arrow_steps.svg" alt="step" class="landing-stepIcon1" />
    @for (step of steps; track $index) {
      <div class="landing-step">
        <h2>{{ step.icon }}</h2>
        <h4>{{ step.title }}</h4>
        <p>{{ step.subtitle }}</p>
      </div>
    }
    <img src="icons/landing/arrow_steps.svg" alt="step" class="landing-stepIcon2" />
  </div>
  <hr />
  <div class="landing-stepsBottomDiv">
    <p>your first card</p>
    <h1>how it works.</h1>
  </div>
</main>
