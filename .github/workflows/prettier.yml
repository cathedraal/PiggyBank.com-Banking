name: Lint
on:
  pull_request:
  push:
    branches: ['main']
permissions: {}
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: |
          yarn
          yarn prettier . --write
      - name: Prettier
        run: ./node_modules/.bin/prettier . --check
